<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日常计算器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator" aria-labelledby="title">
    <header><span class="eyebrow">简单 · 专注</span><h1 id="title">日常计算器</h1><p>按输入顺序计算</p></header>
    <section class="display" aria-label="计算显示">
      <div id="context" aria-label="待执行运算">&nbsp;</div>
      <output id="result" aria-live="polite" aria-atomic="true">0</output>
    </section>
    <p id="notice" role="status"></p>
    <div class="keys" aria-label="计算键盘">
      <button data-type="clear" class="utility" aria-label="全部清空">AC</button>
      <button data-type="sign" class="utility" aria-label="切换正负号">±</button>
      <button data-type="backspace" class="utility" aria-label="退格">⌫</button>
      <button data-type="operator" data-value="/" class="operator" aria-label="除">÷</button>
      <button data-type="digit" data-value="7">7</button><button data-type="digit" data-value="8">8</button><button data-type="digit" data-value="9">9</button>
      <button data-type="operator" data-value="*" class="operator" aria-label="乘">×</button>
      <button data-type="digit" data-value="4">4</button><button data-type="digit" data-value="5">5</button><button data-type="digit" data-value="6">6</button>
      <button data-type="operator" data-value="-" class="operator" aria-label="减">−</button>
      <button data-type="digit" data-value="1">1</button><button data-type="digit" data-value="2">2</button><button data-type="digit" data-value="3">3</button>
      <button data-type="operator" data-value="+" class="operator" aria-label="加">+</button>
      <button data-type="digit" data-value="0" class="zero">0</button><button data-type="decimal" aria-label="小数点">.</button><button data-type="equals" class="equals" aria-label="等于">=</button>
    </div>
    <footer>键盘也可输入 · Enter 计算 · Esc 清空</footer>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
